[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pulumitest"
dynamic = ["version"]
description = "Python testing utilities for Pulumi programs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Jonathan Davenport", email = "jdavenport@pulumi.com" },
]
dependencies = ["pulumi>=3.0.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["pulumitest"]
